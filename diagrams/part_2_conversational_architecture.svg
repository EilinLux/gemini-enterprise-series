<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="hubShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.12"/>
    </filter>
    <!-- Markers for arrows -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea4335"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#137333"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0288d1"/>
    </marker>
  </defs>

  <!-- 1. Top Browser / Client Node -->
  <g transform="translate(280, 25)">
    <rect width="540" height="75" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="270" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">EMPLOYEE / CLIENT WEB BROWSER</text>
    <text x="270" y="55" text-anchor="middle" font-size="13" font-weight="400" fill="#5f6368">(Gemini Enterprise Web App UI: &quot;Ask DoubleClick Enterprise Anything&quot;)</text>
  </g>

  <!-- Connection: Browser -> Primary Assistant -->
  <path d="M 550 100 L 550 148" fill="none" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="490" y="112" width="120" height="22" rx="6" fill="#ffffff" stroke="#e8f0fe" stroke-width="1"/>
  <text x="550" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">User Prompt</text>

  <!-- 2. Primary Assistant Hub -->
  <g transform="translate(200, 155)">
    <rect width="700" height="155" rx="16" fill="#f5f0ff" stroke="#9334e6" stroke-width="2" filter="url(#hubShadow)"/>
    <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#202124">GEMINI ENTERPRISE PRIMARY ASSISTANT</text>
    <text x="350" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">(Top-Level Orchestrator Hub: double-click-enterprise-app)</text>
    <line x1="30" y1="65" x2="670" y2="65" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="45" y="88" font-size="12" fill="#3c4043"><tspan font-weight="700">• Session &amp; Identity:</tspan> Manages conversation session &amp; enterprise security identity</text>
    <text x="45" y="110" font-size="12" fill="#3c4043"><tspan font-weight="700">• Direct RAG:</tspan> Performs native RAG search across Part 1 Data Stores (GCS &amp; BigQuery)</text>
    <text x="45" y="132" font-size="12" fill="#3c4043"><tspan font-weight="700">• Central LLM Router:</tspan> Decides whether to answer directly or route to a specialized Agent</text>
  </g>

  <!-- Connection: Primary Assistant -> Dialogflow CX -->
  <path d="M 330 310 L 330 350 L 195 350 L 195 388" fill="none" stroke="#ea4335" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="200" y="338" width="115" height="22" rx="6" fill="#ffffff" stroke="#fce8e6" stroke-width="1"/>
  <text x="257" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#c5221f">Internal Route</text>

  <!-- Connection: Primary Assistant -> Remote A2A -->
  <path d="M 550 310 L 550 388" fill="none" stroke="#137333" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="475" y="338" width="150" height="22" rx="6" fill="#ffffff" stroke="#e6f4ea" stroke-width="1"/>
  <text x="550" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#0d652d">Remote A2A Dispatch</text>

  <!-- Connection: Primary Assistant -> ADK -->
  <path d="M 770 310 L 770 350 L 905 350 L 905 388" fill="none" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="790" y="338" width="115" height="22" rx="6" fill="#ffffff" stroke="#e1f5fe" stroke-width="1"/>
  <text x="847" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#01579b">Execution Call</text>

  <!-- 3. Left Agent: Conversational QA Agent (Dialogflow CX) -->
  <g transform="translate(45, 395)">
    <rect width="300" height="240" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#202124">CONVERSATIONAL QA AGENT</text>
    <text x="150" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#c5221f">(Dialogflow CX)</text>
    <line x1="20" y1="58" x2="280" y2="58" stroke="#fca5a5" stroke-width="1"/>
    <text x="20" y="80" font-size="11" font-weight="700" fill="#202124">• WHERE CREATED:</text>
    <text x="30" y="98" font-size="11" fill="#3c4043">Dialogflow CX Console &amp;</text>
    <text x="30" y="114" font-size="11" font-family="monospace" fill="#5f6368">terraform/dialogflow_cx.tf</text>
    
    <text x="20" y="138" font-size="11" font-weight="700" fill="#202124">• RUNTIME:</text>
    <text x="30" y="156" font-size="11" fill="#3c4043">Dialogflow CX managed</text>
    <text x="30" y="172" font-size="11" fill="#3c4043">service (<tspan font-family="monospace">global</tspan>)</text>

    <text x="20" y="196" font-size="11" font-weight="700" fill="#202124">• BRAIN:</text>
    <text x="30" y="214" font-size="11" fill="#3c4043">Generative Playbook</text>
    <text x="30" y="230" font-size="11" fill="#5f6368">(Policy, Guardrails, Clearances)</text>
  </g>

  <!-- 4. Center Agent: Remote Supply-Chain A2A Agent -->
  <g transform="translate(400, 395)">
    <rect width="300" height="240" rx="14" fill="#e6f4ea" stroke="#137333" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#202124">REMOTE SUPPLY-CHAIN</text>
    <text x="150" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">(A2A Open Protocol)</text>
    <line x1="20" y1="58" x2="280" y2="58" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="80" font-size="11" font-weight="700" fill="#202124">• WHERE CREATED:</text>
    <text x="30" y="98" font-size="11" fill="#3c4043">External Web Service</text>
    <text x="30" y="114" font-size="11" fill="#5f6368">(Cloud Run / Remote API)</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#202124">• RUNTIME:</text>
    <text x="30" y="156" font-size="11" fill="#3c4043">Remote HTTPS Endpoint</text>
    <text x="30" y="172" font-size="11" fill="#5f6368">(A2A JSON Schema 0.2.1)</text>

    <text x="20" y="196" font-size="11" font-weight="700" fill="#202124">• HOW REGISTERED:</text>
    <text x="30" y="214" font-size="11" fill="#3c4043">Paste JSON Agent Card</text>
    <text x="30" y="230" font-size="10.5" font-family="monospace" fill="#5f6368">double_click_a2a_agent_card.json</text>
  </g>

  <!-- 5. Right Agent: Code-First Concierge (ADK Agent) -->
  <g transform="translate(755, 395)">
    <rect width="300" height="240" rx="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#202124">CODE-FIRST CONCIERGE</text>
    <text x="150" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#0288d1">(ADK Agent)</text>
    <line x1="20" y1="58" x2="280" y2="58" stroke="#7dd3fc" stroke-width="1"/>
    <text x="20" y="80" font-size="11" font-weight="700" fill="#202124">• WHERE CREATED:</text>
    <text x="30" y="98" font-size="11" fill="#3c4043">Python code</text>
    <text x="30" y="114" font-size="10.5" font-family="monospace" fill="#5f6368">agents/adk_double_click_agent/agent.py</text>

    <text x="20" y="138" font-size="11" font-weight="700" fill="#202124">• RUNTIME:</text>
    <text x="30" y="156" font-size="11" fill="#3c4043">Vertex AI Agent Engine</text>
    <text x="30" y="172" font-size="11" fill="#5f6368">(<tspan font-family="monospace">europe-west1</tspan>)</text>

    <text x="20" y="196" font-size="11" font-weight="700" fill="#202124">• HOW REGISTERED:</text>
    <text x="30" y="214" font-size="11" fill="#3c4043">Paste ReasoningEngine</text>
    <text x="30" y="230" font-size="10.5" font-family="monospace" fill="#5f6368">projects/.../reasoningEngines/...</text>
  </g>
</svg>
